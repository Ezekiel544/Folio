# Optional Render blueprint. Kept as an alternative to Vercel; both talk to the
# same Supabase Postgres (DATABASE_URL). No disk is needed now that storage is
# hosted. Secrets use `sync: false`, so Render prompts for them on first deploy
# and never stores them in git.

services:
  - type: web
    name: folio
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PHAROS_API_KEY
        sync: false
      - key: PHAROS_RECEIPT_SECRET
        sync: false
      - key: PHAROS_SESSION_SECRET
        sync: false
      # Onchain anchoring (Sepolia). Leave blank to run fully offchain.
      - key: PHAROS_RPC_URL
        sync: false
      - key: PHAROS_ISSUER_PRIVATE_KEY
        sync: false
      - key: PHAROS_RECEIPT_REGISTRY_ADDRESS
        sync: false
      - key: PHAROS_ISSUER_ADDRESS
        sync: false
